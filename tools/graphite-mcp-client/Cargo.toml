[package]
name = "graphite-mcp-client"
version = "0.1.0"
description = "MCP relay server for Graphite: bridges stdio (agent) to WebSocket (browser)"
license = "Apache-2.0"
edition = "2021"

[[bin]]
name = "graphite-mcp-client"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "io-std", "io-util", "rt", "rt-multi-thread", "net", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde_json = "1"
anyhow = "1"